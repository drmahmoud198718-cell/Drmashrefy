<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصاريفي الشهرية</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060d1f">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--bg:#eef2fb;--cd:#fff;--tx:#10204a;--mu:#6b7aa3;--ac:#2563eb;--ac2:#0ea5e9;--at:var(--ac);--bd:#e2e8f6;--rd:#dc2626;--am:#b45309;--ok:#16a34a;--bl:color-mix(in srgb,var(--ac) 10%,var(--cd));--sh:0 2px 4px rgba(30,50,110,.05),0 10px 26px rgba(30,50,110,.08);--bgi:none;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-th="blue"]{--ac:#2563eb;--ac2:#0ea5e9}
:root[data-th="green"]{--ac:#059669;--ac2:#0d9488}
:root[data-th="purple"]{--ac:#7c3aed;--ac2:#c026d3}
:root[data-th="orange"]{--ac:#ea580c;--ac2:#db2777}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060d1f;--cd:#0e1830;--tx:#eaf0ff;--mu:#8b9bc0;--bd:#1b2a4d;--rd:#ff7b8a;--am:#f5b45a;--ok:#4ade80;--at:color-mix(in srgb,var(--ac) 50%,#fff);--sh:none;--bgi:radial-gradient(700px 360px at 85% -5%,color-mix(in srgb,var(--ac) 28%,transparent),transparent 70%);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060d1f;--cd:#0e1830;--tx:#eaf0ff;--mu:#8b9bc0;--bd:#1b2a4d;--rd:#ff7b8a;--am:#f5b45a;--ok:#4ade80;--at:color-mix(in srgb,var(--ac) 50%,#fff);--sh:none;--bgi:radial-gradient(700px 360px at 85% -5%,color-mix(in srgb,var(--ac) 28%,transparent),transparent 70%);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Cairo,Tahoma,"Segoe UI",sans-serif;padding:12px 14px 96px;max-width:640px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.top h1{font-size:22px;margin:0}
h2{font-size:17px;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--ac),var(--ac2))}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px color-mix(in srgb,var(--ac) 30%,transparent)}
.hero small{color:rgba(255,255,255,.82)}
.hero .big{font-size:34px;font-weight:700;line-height:1.2}
.hero .big span{font-size:15px;font-weight:400;opacity:.85}
.hero .bar{background:rgba(255,255,255,.28);margin:10px 0 12px}
.hero .bar i{background:#fff}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.hs b{display:block;font-size:18px}
.gh{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin:16px 4px 6px;font-size:15px}
.gh span:last-child{color:var(--mu);font-weight:400;font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row>div:first-child{flex:1;min-width:0}
small{display:block;color:var(--mu);font-size:13px}
.amt{font-weight:700;white-space:nowrap}
.nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.nav b{font-size:18px}
button{font:inherit;border:0;border-radius:12px;padding:9px 16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer}
button.g{background:var(--bl);color:var(--at)}
button.x{background:none;color:var(--mu);padding:4px 8px}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.f .w{grid-column:1/3}
label{font-size:13px;color:var(--mu)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:18px}
.al{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:15px;border-inline-start:5px solid;background:var(--bl)}
.al.rd{border-color:var(--rd);color:var(--rd)}
.al.am{border-color:var(--am);color:var(--am)}
.al.in{border-color:var(--ac);color:var(--at)}
.tabs{position:fixed;inset:auto 0 0 0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.tabs button{flex:1;background:none;color:var(--mu);padding:4px 0;font-size:11.5px;border-radius:12px;line-height:1.3}
.tabs button i{display:block;font-style:normal;font-size:19px}
.tabs button.on{color:var(--at);font-weight:700;background:var(--bl)}
.ck{width:24px;height:24px;accent-color:var(--ac)}
.done{opacity:.7}
.bar{height:8px;background:var(--bl);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.empty{color:var(--mu);text-align:center;padding:16px 0}
#cf{position:fixed;left:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;padding:0;font-size:24px;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kp button{padding:13px 0;font-size:21px;background:var(--bl);color:var(--tx)}
.kp .o{color:var(--at);font-weight:700}
.kp .e{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.cd{direction:ltr;text-align:right;padding:6px 4px}
.cd small{min-height:20px;font-size:15px;word-break:break-all}
.cd b{display:block;font-size:34px;word-break:break-all}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh);min-height:104px;cursor:pointer}
.tile .tn{font-weight:600}
.tile .tv{font-size:20px;font-weight:700;margin:6px 0 2px}
.tile.pd{opacity:.6}
.tile.add{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--at);font-weight:600}
.tot{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:10px 0 2px;margin-top:4px;border-top:2px solid var(--bd)}
.tot span:last-child{color:var(--at)}
.card.tot{padding:12px 14px;margin-top:0}
.res{border-radius:16px;padding:12px 14px;margin-bottom:14px;border:1px solid}
.res.bad{background:color-mix(in srgb,var(--rd) 12%,var(--cd));border-color:var(--rd);color:var(--rd)}
.res.good{background:color-mix(in srgb,var(--ok) 12%,var(--cd));border-color:var(--ok);color:var(--ok)}
.res .rb{font-size:32px;font-weight:700;line-height:1.3}
.res .rb span{font-size:15px;font-weight:400}
.res small{color:var(--mu)}
.card .row,.res .row{background:var(--bg);border:1px solid var(--bd)!important;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.inote{font-size:13px;color:var(--at);margin-top:4px;white-space:pre-wrap}
.hs2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.hs2 b{display:block;font-size:15px}
.done2{opacity:.6}
.sr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.sr:last-child{border:0}
summary{cursor:pointer;font-weight:700}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{color:var(--mu);font-weight:600;font-size:12px;text-align:start;padding:8px 6px;border-bottom:2px solid var(--bd)}
.tb td{padding:9px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
.tb tfoot td{font-weight:700;border-bottom:0;color:var(--at)}
.tb td:last-child,.tb th:last-child{text-align:end;white-space:nowrap}
body{background-image:var(--bgi);background-attachment:fixed}
.card{border-radius:18px}
.top small{color:var(--mu)}
.tabs{background:color-mix(in srgb,var(--cd) 92%,transparent);backdrop-filter:blur(10px)}
.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 40%,transparent)}
.hero{box-shadow:0 14px 34px color-mix(in srgb,var(--ac) 38%,transparent)}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.i1{background:color-mix(in srgb,#7c3aed 24%,transparent)}
.i2{background:color-mix(in srgb,#2563eb 24%,transparent)}
.i3{background:color-mix(in srgb,#16a34a 24%,transparent)}
.i4{background:color-mix(in srgb,#f59e0b 26%,transparent)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:16px;color:#fff;font-size:14px;font-weight:600}
.q span{font-size:24px}
.q1{background:linear-gradient(135deg,#7c3aed,#4f46e5)}
.q2{background:linear-gradient(135deg,#16a34a,#059669)}
.q3{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.q4{background:linear-gradient(135deg,#2563eb,#0ea5e9)}
.dn{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none}
.dn>div{background:var(--cd);width:88px;height:88px;border-radius:50%;display:grid;place-items:center;align-content:center;text-align:center}
.dn b{display:block;font-size:15px}
.card .row{background:color-mix(in srgb,var(--tx) 5%,var(--cd));border-color:color-mix(in srgb,var(--tx) 14%,transparent)!important}
.card .row.it{border-inline-start:4px solid var(--rc)!important;gap:10px;padding:12px}
.row.it.i1{--rc:#7c3aed}.row.it.i2{--rc:#2563eb}.row.it.i3{--rc:#16a34a}
.nm{font-size:17px;display:block;line-height:1.35}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:12px;background:color-mix(in srgb,var(--tx) 9%,transparent);color:var(--mu);padding:2px 9px;border-radius:20px}
.amx{text-align:end}
.amx b{display:block;font-size:18px;white-space:nowrap}
.st{font-size:12px;font-weight:700;padding:1px 10px;border-radius:20px;display:inline-block;margin-top:3px}
.st.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.st.am{background:color-mix(in srgb,var(--am) 22%,transparent);color:var(--am)}
.st.rd{background:color-mix(in srgb,var(--rd) 20%,transparent);color:var(--rd)}
.st.mu{background:color-mix(in srgb,var(--tx) 9%,transparent);color:var(--mu)}
.card .row>div:first-child b{font-size:16px}
.amt{font-size:17px}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs" id="tabs"></div>
<script>
const K='masarifi1';let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{fixed:[],inst:[],cards:[],wd:[],vars:[],paid:{},pay:[]};S.pay=S.pay||[];S.cash=S.cash||[];S.xi=S.xi||[];S.xv=S.xv||{};S.notes=S.notes||[];S.vn=S.vn||[];S.inote=S.inote||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),V=id=>$('#'+id).value.trim();
const fmt=n=>Math.round(n).toLocaleString('ar-EG');
const now=new Date(),pad=n=>String(n).padStart(2,'0');
const M0=now.getFullYear()+'-'+pad(now.getMonth()+1);
let M=M0,tab='home',arm='';
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const mi=k=>{const[y,m]=k.split('-');return +y*12+ +m-1};
const mk=i=>Math.floor(i/12)+'-'+pad(i%12+1);
const add=(k,n)=>mk(mi(k)+n);
const mn=k=>MN[+k.split('-')[1]-1]+' '+k.split('-')[0];
const uid=()=>Math.random().toString(36).slice(2,9);
const dim=(y,m)=>new Date(y,m,0).getDate();
const today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());

function dues(m){const r=[];
 S.fixed.forEach(f=>r.push({id:'f'+f.id,k:'ثابت',name:f.name,sub:'مصروف ثابت',amt:f.amt,day:f.day}));
 S.xi.forEach(x=>r.push({id:'x'+x.id,k:'إضافي',name:x.name,sub:'بند إضافي',amt:S.xv[x.id+'|'+m]||0,day:x.day}));
 S.inst.forEach(i=>{const x=mi(m)-mi(i.start);if(x>=0&&x<i.n)r.push({id:'i'+i.id,k:'قسط',name:i.name,sub:i.ent+' — قسط '+fmt(x+1)+' من '+fmt(i.n),amt:i.amt,day:i.day})});
 S.cards.forEach(c=>{const w=S.wd.filter(w=>w.c==c.id&&mi(w.m)+1==mi(m));if(w.length)r.push({id:'c'+c.id,k:'فيزا',name:c.name,sub:fmt(w.length)+' سحب + مصاريف إدارية',amt:w.reduce((a,b)=>a+b.amt+b.fee,0),day:c.day})});
 return r.sort((a,b)=>a.day-b.day)}
const payS=(ref,m)=>S.pay.filter(p=>p.ref==ref&&p.m==m).reduce((a,p)=>a+p.amt,0);
function sched(ref){if(ref[0]=='i'){const i=S.inst.find(x=>'i'+x.id==ref);return i?Array.from({length:i.n},(_,k)=>({m:add(i.start,k),amt:i.amt})):[]}
 if(ref[0]=='c'){const c=ref.slice(1),mm={};S.wd.filter(w=>w.c==c).forEach(w=>{const m=add(w.m,1);mm[m]=(mm[m]||0)+w.amt+w.fee});return Object.keys(mm).sort().map(m=>({m,amt:mm[m]}))}return[]}
function alloc(ref){const sc=sched(ref),r={};if(!sc.length)return r;
 const lo=[...sc.map(x=>x.m),...S.pay.filter(p=>p.ref==ref).map(p=>p.m)].sort()[0],hi=sc[sc.length-1].m;let cr=0;
 for(let k=mi(lo);k<=mi(hi);k++){const m=mk(k),d=sc.find(x=>x.m==m),av=payS(ref,m)+cr+(d&&S.paid[ref+'|'+m]?d.amt:0);
  if(d){const p=Math.min(d.amt,av);r[m]=p;cr=av-p}else cr=av}
 return r}
const remOf=ref=>{const al=alloc(ref);return sched(ref).filter(x=>ref[0]!='i'||x.m>=M0).reduce((a,x)=>a+x.amt-(al[x.m]||0),0)};
const monthPaid=(ref,m)=>{const x=sched(ref).find(x=>x.m==m);return !!x&&(alloc(ref)[m]||0)>=x.amt-.5};
function paidOf(d,m){if(d.id[0]=='f'||d.id[0]=='x')return Math.min(d.amt,(S.paid[d.id+'|'+m]?d.amt:0)+payS(d.id,m));return alloc(d.id)[m]||0}
const isPaid=(d,m)=>d.amt>0&&paidOf(d,m)>=d.amt-.5;
function tgl(id,m){const d=dues(m).find(x=>x.id==id);if(!d)return;
 if(isPaid(d,m)){S.pay=S.pay.filter(p=>!(p.ref==id&&p.m==m));delete S.paid[id+'|'+m]}
 else S.pay.push({id:uid(),ref:id,amt:d.amt-paidOf(d,m),m,d:today,t:Date.now()});
 save();R()}
function owed(c){return remOf('c'+c.id)}

function alerts(){const out=[],t=new Date(now.getFullYear(),now.getMonth(),now.getDate()),[y,m]=M0.split('-').map(Number);
 dues(M0).forEach(d=>{if(!d.amt||isPaid(d,M0))return;
  const df=Math.round((new Date(y,m-1,Math.min(d.day,dim(y,m)))-t)/864e5);
  if(df<0)out.push({c:'rd',t:`${d.k}: ${d.name} متأخر ${fmt(-df)} يوم — ${fmt(d.amt)} جنيه`});
  else if(df<=5)out.push({c:'am',t:`${d.k}: ${d.name} — ${fmt(d.amt)} جنيه ${df==0?'النهاردة':'بعد '+fmt(df)+' يوم'}`})});
 S.inst.forEach(i=>{if(remOf('i'+i.id)<=0)return;const e=add(i.start,i.n-1),[ey,em]=e.split('-').map(Number);
  const df=Math.round((new Date(ey,em-1,Math.min(i.day,dim(ey,em)))-t)/864e5);
  if(df>=0&&df<=31)out.push({c:'in',t:`قسط ${i.name} (${i.ent}) بيخلص ${df==0?'النهاردة':'بعد '+fmt(df)+' يوم'} — آخر قسط ${mn(e)}`})});
 return out.sort((a,b)=>'rd,am,in'.indexOf(a.c)-'rd,am,in'.indexOf(b.c))}

const mnav=()=>`<div class="nav"><button class="g" onclick="mv(1)">‹</button><b>${mn(M)}</b><button class="g" onclick="mv(-1)">›</button></div>`;
function mv(n){M=add(M,-n);R()}
const SP={fixed:[['name','الاسم','text'],['amt','المبلغ','number'],['day','يوم الدفع','number']],inst:[['name','اسم القسط','text'],['ent','الجهة','text'],['amt','القسط الشهري','number'],['day','يوم الدفع','number'],['start','أول قسط','month'],['n','عدد الأقساط','number']],vars:[['name','البند','text'],['amt','المبلغ','number'],['d','التاريخ','date']],wd:[['amt','المسحوب','number'],['fee','مصاريف إدارية','number'],['m','شهر السحب','month'],['rem','الباقي في الفيزا','number']],pay:[['amt','المبلغ','number'],['m','عن شهر','month'],['d','تاريخ الدفع','date']],cards:[['name','اسم الفيزا','text'],['day','يوم السداد','number']]};
const del=(a,id)=>`<button class="x" style="font-size:22px;line-height:1" onclick="mu='${a}|${id}';R()">⋮</button>`;
const hm=x=>del({f:'fixed',i:'inst',c:'cards'}[x.id[0]],x.id.slice(1));
function rm(a,id){if(arm!==a+id){arm=a+id;R();return}arm='';
 S[a]=S[a].filter(x=>x.id!=id);if(a=='cards')S.wd=S.wd.filter(w=>w.c!=id);if(a=='notes'||a=='vn')adel(id);delete S.inote[a+'|'+id];save();R()}
const inp=(id,l,t='text',v='',cl='')=>`<div class="${cl}"><label>${l}</label><input id="${id}" type="${t}" value="${v}" ${t=='number'?'inputmode="decimal"':''}></div>`;
const num=id=>parseFloat(V(id).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)))||0;
const dayv=id=>Math.min(31,Math.max(1,Math.round(num(id))||1));

const KI={'قسط':['🧾','الأقساط'],'فيزا':['💳','الفيزا'],'ثابت':['📌','المصاريف الثابتة']},TI={home:'🏠',fixed:'📌',inst:'🧾',card:'💳',pays:'💵',vars:'🛒'};
function home(){const d=dues(M),tv=S.vars.filter(v=>v.m==M).reduce((a,b)=>a+b.amt,0),td=d.reduce((a,b)=>a+b.amt,0);
 const pd=d.reduce((a,x)=>a+paidOf(x,M),0),tot=td+tv,kc=S.cash.filter(c=>c.m==M).reduce((a,b)=>a+b.amt,0),al=alerts(),pc=tot?Math.round(pd/tot*100):0;
 const grp=Object.keys(KI).map(k=>{const g=d.filter(x=>x.k==k);if(!g.length)return'';
  return `<div class="gh"><span>${KI[k][0]} ${KI[k][1]}</span><span>اتدفع ${fmt(g.reduce((a,x)=>a+paidOf(x,M),0))} من ${fmt(g.reduce((a,x)=>a+x.amt,0))}</span></div><div class="card">${g.map(irow).join('')}<div class="tot"><span>إجمالي ${KI[k][1]}</span><span>${fmt(g.reduce((a,x)=>a+x.amt,0))} جنيه</span></div></div>`}).join('');
 return mnav()+(M==M0?al.map(a=>`<div class="al ${a.c}">${a.t}</div>`).join(''):'')+
 `<div class="hero"><small>إجمالي ${mn(M)}</small><div class="big">${fmt(tot)} <span>جنيه</span></div><div class="bar"><i style="width:${pc}%"></i></div><div class="hs"><div><small>اتدفع</small><b>${fmt(pd)}</b></div><div><small>باقي المستحقات</small><b>${fmt(td-pd)}</b></div><div><small>إضافية</small><b>${fmt(tv)}</b></div></div></div>`+
